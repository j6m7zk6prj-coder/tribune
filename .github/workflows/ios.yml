name: Compiler Tribune

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1); fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Préparer le projet
        run: |
          mkdir -p Tribune/Assets.xcassets/AppIcon.appiconset
          echo '{ "info" : { "author" : "xcode", "version" : 1 } }' > Tribune/Assets.xcassets/Contents.json
          cp icon.png Tribune/Assets.xcassets/AppIcon.appiconset/icon.png
          echo '{ "images" : [ { "filename" : "icon.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }' > Tribune/Assets.xcassets/AppIcon.appiconset/Contents.json
          brew install xcodegen
          xcodegen generate

      - name: Compiler pour iPhone
        run: |
          xcodebuild -project Tribune.xcodeproj -target Tribune -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          if grep -q "BUILD SUCCEEDED" build.log && test -f build/Release-iphoneos/Tribune.app/Tribune; then
            echo "BUILD SUCCEEDED"
          else
            echo "===== ERREURS ====="
            mkdir -p shots
            grep -n -E "error:" build.log | sort -u | head -60 > shots/errors.txt || true
            tail -40 build.log >> shots/errors.txt
            cat shots/errors.txt
            exit 1
          fi

      - name: Emballer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Tribune.app Payload/
          # Signature ad hoc avec les droits (groupe d'apps partagé avec le widget) : iLoader re-signe ensuite.
          codesign -f -s - --entitlements Entitlements/TribuneWidget.entitlements Payload/Tribune.app/PlugIns/TribuneWidget.appex
          codesign -f -s - --entitlements Entitlements/Tribune.entitlements Payload/Tribune.app
          codesign -d --entitlements - Payload/Tribune.app | tail -8
          zip -qry Tribune.ipa Payload

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tribune (dernière version)
          body: Téléchargez **Tribune.ipa** ci-dessous, puis installez-le avec iLoader.
          make_latest: true
          files: Tribune.ipa

      - name: Compiler pour le simulateur
        run: |
          xcodebuild -project Tribune.xcodeproj -target Tribune -configuration Debug -sdk iphonesimulator \
            -arch arm64 SYMROOT="$PWD/simbuild" CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || (grep -n "error:" sim.log | head -20; exit 1)

      - name: Captures d'écran (simulateur)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v]
          p=[x for x in c if x['name']=='iPhone 17 Pro'] or [x for x in c if x['name'].startswith('iPhone 17')] or [x for x in c if x['name'].startswith('iPhone')]
          print(p[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" simbuild/Debug-iphonesimulator/Tribune.app
          mkdir -p shots
          shot () {
            xcrun simctl terminate "$UDID" com.tepsko.tribune 2>/dev/null || true
            xcrun simctl launch "$UDID" com.tepsko.tribune "${@:2}"
            sleep 14
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
          }
          shot 00a-ligues-europe -tab leagues -scroll
          shot 00b-ldc -tab leagues -open league -league uefa.champions
          shot 00c-europa -tab leagues -open league -league uefa.europa -pane matches
          shot 00d-conference -tab leagues -open league -league uefa.europa.conf
          shot 00e-avant-match -tab matches -day 1 -open nextmatch
          shot 01-matchs-aujourdhui -tab matches
          shot 02-matchs-jour -tab matches -day -2
          shot 03-match-resume -tab matches -day -2 -open match
          shot 04-match-compos -tab matches -day -2 -open match -detailTab compos
          shot 04b-joueur -tab matches -day -2 -open match -detailTab compos -player
          shot 05-match-stats -tab matches -day -2 -open match -detailTab stats
          shot 06-match-classement -tab matches -day -2 -open match -detailTab table
          shot 07-ligues -tab leagues
          shot 08-ligue -tab leagues -open league
          shot 08b-cl-2015-finale -tab leagues -open league -league uefa.champions -season 2015 -pane final
          shot 08c-pl-2015-classement -tab leagues -open league -league eng.1 -season 2015
          shot 08d-pl-stats -tab leagues -open league -league eng.1 -season 2025 -pane stats
          shot 08e-cdm-2022 -tab leagues -open league -league fifa.world -season 2022 -pane final
          shot 09-suivis -tab following -seed
          shot 10-equipe -tab following -seed -open team
          shot 13-widgets -widgets -seed
          shot 08f-ligue3 -tab leagues -open league -league fra.3
          shot 08g-ligue3-matchs -tab leagues -open league -league fra.3 -pane matches
          shot 11-reglages -tab matches -settings
          shot 12-matchs-clair -tab matches -day -2 -appearance light
          ls -la shots

      - name: Envoyer les captures (branche screenshots)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b screenshots
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Captures $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
