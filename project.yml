# Projet Xcode de l'app Tribune (généré par XcodeGen sur GitHub).
name: Tribune
options:
  bundleIdPrefix: com.tepsko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"

targets:
  Tribune:
    type: application
    platform: iOS
    sources:
      - path: Tribune
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tribune
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tepsko.tribune
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
