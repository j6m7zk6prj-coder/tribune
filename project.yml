# Projet Xcode de l'app Tribune (généré par XcodeGen sur GitHub).
name: Tribune
options:
  bundleIdPrefix: com.tepsko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"

targets:
  Tribune:
    type: application
    platform: iOS
    sources:
      - path: Tribune
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tribune
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: TribuneWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tepsko.tribune
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements/Tribune.entitlements

  TribuneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TribuneWidget
      - path: Tribune/ESPNModels.swift
      - path: Tribune/Model.swift
      - path: Tribune/API.swift
      - path: Tribune/Design.swift
      - path: Tribune/Components.swift
      - path: Tribune/Store.swift
      - path: Tribune/WidgetShared.swift
      - path: Tribune/PlayerView.swift
      - path: Tribune/LineupView.swift
      - path: Tribune/MatchesView.swift
      - path: Tribune/MatchDetailView.swift
      - path: Tribune/StatsView.swift
      - path: Tribune/StandingsView.swift
      - path: Tribune/LeaguesView.swift
      - path: Tribune/FollowingView.swift
      - path: Tribune/SettingsView.swift
      - path: Tribune/DiagView.swift
      - path: Tribune/SeasonView.swift
      - path: Tribune/Badges.swift
      - path: Tribune/SportsDB.swift
      - path: Tribune/Themes.swift
      - path: Tribune/MatchExtras.swift
      - path: Tribune/Splash.swift
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Tribune
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tepsko.tribune.widget
        CODE_SIGN_ENTITLEMENTS: Entitlements/TribuneWidget.entitlements
        SKIP_INSTALL: YES
